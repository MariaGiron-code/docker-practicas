<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Gestión de Personal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 30px 20px;
            color: #333;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        h2 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .form-section {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
        }

        .form-section h3 {
            margin-bottom: 20px;
            color: #333;
            font-size: 1.3em;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        #empleadoForm {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            align-items: end;
        }

        input {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 1em;
            transition: all 0.3s ease;
            background: #f9f9f9;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        input::placeholder {
            color: #999;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1em;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        #btnGuardar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            grid-column: 1 / -1;
        }

        #btnGuardar:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        #btnCancelar {
            background: #6c757d;
            color: white;
        }

        #btnCancelar:hover {
            background: #5a6268;
            transform: translateY(-2px);
        }

        .table-section {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            overflow-x: auto;
        }

        .table-section h3 {
            margin-bottom: 20px;
            color: #333;
            font-size: 1.3em;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 0.9em;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #e0e0e0;
        }

        tbody tr {
            transition: all 0.3s ease;
        }

        tbody tr:hover {
            background-color: #f8f9ff;
            box-shadow: inset 0 0 10px rgba(102, 126, 234, 0.1);
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        .btn-edit, .btn-delete {
            padding: 8px 15px;
            margin-right: 8px;
            font-size: 0.85em;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
        }

        .btn-edit {
            background: #ffc107;
            color: #333;
            font-weight: 600;
        }

        .btn-edit:hover {
            background: #e0a800;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(255, 193, 7, 0.3);
        }

        .btn-delete {
            background: #dc3545;
        }

        .btn-delete:hover {
            background: #c82333;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(220, 53, 69, 0.3);
        }

        .acciones-cell {
            display: flex;
            gap: 8px;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        @media (max-width: 768px) {
            h2 {
                font-size: 1.8em;
            }

            #empleadoForm {
                grid-template-columns: 1fr;
            }

            #btnGuardar {
                grid-column: 1;
            }

            .table-section {
                padding: 20px;
            }

            th, td {
                padding: 10px;
                font-size: 0.9em;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🏢 Sistema de Gestión de Personal</h2>

    <!-- Sección del Formulario -->
    <div class="form-section">
        <h3>✏️ Agregar o Actualizar Empleado</h3>
        <form id="empleadoForm">
            <input id="empId" type="hidden">
            <input id="nombre" placeholder="Nombre completo" required type="text">
            <input id="cargo" placeholder="Cargo" required type="text">
            <input id="sueldo" placeholder="Sueldo" required step="0.01" type="number">
            <button id="btnGuardar" type="submit">Guardar</button>
            <button id="btnCancelar" onclick="resetForm()" style="display:none; background:#6c757d;" type="button">Cancelar</button>
        </form>
    </div>

    <!-- Sección de la Tabla de Empleados -->
    <div class="table-section">
        <h3>📋 Listado de Empleados</h3>
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Cargo</th>
                <th>Sueldo</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody id="tablaBody">
            </tbody>
        </table>
    </div>
</div>

<script>
    const form = document.getElementById('empleadoForm');
    const tablaBody = document.getElementById('tablaBody');

    cargarEmpleados();

    async function cargarEmpleados() {
        const respuesta = await fetch('/personal');
        const empleados = await respuesta.json();

        tablaBody.innerHTML = '';
        
        if (empleados.length === 0) {
            tablaBody.innerHTML = '<tr><td colspan="5" class="empty-state">No hay empleados registrados. ¡Agrega uno nuevo!</td></tr>';
            return;
        }

        empleados.forEach(emp => {
            tablaBody.innerHTML += `
                <tr>
                    <td><strong>#${emp.id}</strong></td>
                    <td>${emp.nombre}</td>
                    <td>${emp.cargo}</td>
                    <td><strong>$${parseFloat(emp.sueldo).toLocaleString('es-ES', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</strong></td>
                    <td>
                        <div class="acciones-cell">
                            <button class="btn-edit" onclick="prepararEdicion(${emp.id}, '${emp.nombre}', '${emp.cargo}', ${emp.sueldo})">✏️ Editar</button>
                            <button class="btn-delete" onclick="eliminarEmpleado(${emp.id})">🗑️ Borrar</button>
                        </div>
                    </td>
                </tr>
            `;
        });
    }

    // 2. Crear o Actualizar empleado
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('empId').value;
        const nombre = document.getElementById('nombre').value;
        const cargo = document.getElementById('cargo').value;
        const sueldo = document.getElementById('sueldo').value;

        const url = id ? `/personal/${id}` : '/personal';
        const method = id ? 'PUT' : 'POST';

        await fetch(url, {
            method: method,
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({nombre, cargo, sueldo})
        });

        resetForm();
        await cargarEmpleados();
    });

    // 3. Preparar el formulario para editar
    function prepararEdicion(id, nombre, cargo, sueldo) {
        document.getElementById('empId').value = id;
        document.getElementById('nombre').value = nombre;
        document.getElementById('cargo').value = cargo;
        document.getElementById('sueldo').value = sueldo;
        document.getElementById('btnGuardar').textContent = 'Actualizar';
        document.getElementById('btnCancelar').style.display = 'inline-block';
    }

    // 4. Eliminar empleado
    async function eliminarEmpleado(id) {
        if (confirm('¿Estás seguro de eliminar este empleado?')) {
            await fetch(`/personal/${id}`, {method: 'DELETE'});
            await cargarEmpleados();
        }
    }

    // 5. Limpiar formulario
    function resetForm() {
        form.reset();
        document.getElementById('empId').value = '';
        document.getElementById('btnGuardar').textContent = 'Guardar';
        document.getElementById('btnCancelar').style.display = 'none';
    }
</script>
</body>
</html>
